services:
  postgres:
    image: postgres:16-alpine
    container_name: idea-research-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idea_password}
      POSTGRES_DB: ${POSTGRES_DB:-idea_research_engine}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
